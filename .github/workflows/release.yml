name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./internal/...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - target: windows-arm64
            goos: windows
            goarch: arm64
            ext: ".exe"

    runs-on: ubuntu-latest
    name: build (${{ matrix.target }})

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Build frontend
        run: |
          pnpm --dir web install
          pnpm --dir web run build

      # Both jobs use the version declared in go.mod (1.27).
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/remote-input-${{ matrix.target }}${{ matrix.ext }}" .

      - name: Package
        run: |
          cd dist
          zip "remote-input-${GITHUB_REF_NAME}-${{ matrix.target }}.zip" \
            "remote-input-${{ matrix.target }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v7
        with:
          name: remote-input-${{ matrix.target }}
          path: dist/*.zip

  android:
    needs: test
    runs-on: ubuntu-latest
    name: build (android)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 12
          max_attempts: 3
          retry_wait_seconds: 60
          command: cd android && ./gradlew :app:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/remote-input-${GITHUB_REF_NAME}-android.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: remote-input-android
          path: dist/*.apk

  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.apk
