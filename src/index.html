<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Remote Input</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    overflow: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  html::-webkit-scrollbar {
    display: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1a2e;
    color: #eee;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 16px;
    padding-bottom: 0;
    gap: 12px;
    overflow: hidden;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  .header h1 {
    font-size: 20px;
    font-weight: 600;
  }

  .status {
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 12px;
    font-weight: 500;
  }

  .status.connected    { background: #162447; color: #4ecca3; }
  .status.disconnected { background: #2d1b1b; color: #e74c3c; }
  .status.connecting   { background: #2d2b1b; color: #f0c040; }

  textarea {
    flex: 1;
    width: 100%;
    padding: 14px;
    font-size: 18px;
    line-height: 1.5;
    border: 2px solid #333;
    border-radius: 12px;
    background: #16213e;
    color: #eee;
    resize: none;
    outline: none;
    -webkit-appearance: none;
    overflow-y: auto;
  }

  textarea:focus {
    border-color: #4ecca3;
  }

  textarea::placeholder {
    color: #555;
  }

  .btn-row {
    position: relative;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
    padding: 12px 0;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }

  button {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.15s;
    user-select: none;
    -webkit-user-select: none;
  }

  button:active { opacity: 0.7; }

  button svg {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
  }

  #clearBtn {
    background: #333;
    color: #aaa;
    flex: 1;
  }

  #historyBtn {
    background: #333;
    color: #aaa;
    flex: 1;
  }

  #sendBtn {
    background: #4ecca3;
    color: #fff;
    flex: 2.5;
  }

  .toast {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #4ecca3;
    color: #1a1a2e;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    margin-bottom: 8px;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── History overlay ─────────────────────────────────── */

  .history-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #1a1a2e;
    z-index: 50;
    flex-direction: column;
    padding: 16px;
    padding-bottom: 0;
    gap: 12px;
    overflow: hidden;
  }

  .history-overlay.open {
    display: flex;
  }

  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  .history-header h2 {
    font-size: 20px;
    font-weight: 600;
  }

  .history-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #888;
    user-select: none;
    -webkit-user-select: none;
  }

  .history-toggle input {
    display: none;
  }

  .history-toggle-track {
    width: 36px;
    height: 20px;
    border-radius: 10px;
    background: #333;
    position: relative;
    transition: background 0.2s;
    cursor: pointer;
    flex-shrink: 0;
  }

  .history-toggle input:checked + .history-toggle-track {
    background: #4ecca3;
  }

  .history-toggle-track::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #aaa;
    transition: all 0.2s;
  }

  .history-toggle input:checked + .history-toggle-track::after {
    left: 18px;
    background: #fff;
  }

  .history-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    -webkit-overflow-scrolling: touch;
  }

  .history-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
    font-size: 15px;
  }

  .history-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: #16213e;
    border-radius: 10px;
    padding: 12px;
    flex-shrink: 0;
  }

  .history-item.pinned {
    border-left: 3px solid #f0c040;
  }

  .history-item-content {
    flex: 1;
    min-width: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .history-item-text {
    font-size: 15px;
    line-height: 1.4;
    color: #eee;
    word-break: break-all;
    white-space: pre-wrap;
  }

  .history-item-text.clamped {
    display: -webkit-box;
    -webkit-line-clamp: 7;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .history-item-meta {
    display: flex;
    gap: 12px;
    font-size: 12px;
    color: #666;
    margin-top: 4px;
  }

  .history-item-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }

  .history-item-actions.horizontal {
    flex-direction: row;
  }

  .history-item-actions button {
    padding: 10px;
    background: #2a2a4a;
    color: #aaa;
    border-radius: 8px;
  }

  .history-item-actions button.pinned {
    color: #f0c040;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Remote Input</h1>
  <span id="status" class="status disconnected">Disconnected</span>
</div>

<textarea id="input" placeholder="Tap here and use your phone's voice input or keyboard..." autofocus></textarea>

<div class="btn-row" id="btnRow">
  <button id="clearBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
    </svg>
  </button>
  <button id="historyBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>
    </svg>
  </button>
  <button id="sendBtn">
    <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
      <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
    </svg>
  </button>
  <div id="toast" class="toast"></div>
</div>

<!-- ── History overlay ──────────────────────────────────── -->

<div id="historyOverlay" class="history-overlay">
  <div class="history-header">
    <h2>History <span id="historyCount" style="color:#888;font-weight:400;font-size:16px"></span></h2>
    <label class="history-toggle">
      <input type="checkbox" id="historyRecordToggle">
      <span class="history-toggle-track"></span>
    </label>
  </div>
  <div class="history-list" id="historyList"></div>
  <div class="btn-row">
    <button id="historyClearAllBtn" style="background:#333;color:#aaa;flex:1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
      </svg>
    </button>
    <button id="historyBackBtn" style="background:#4ecca3;color:#fff;flex:2.5">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
      </svg>
    </button>
  </div>
</div>

<script>
(function() {
  var input     = document.getElementById('input');
  var sendBtn   = document.getElementById('sendBtn');
  var clearBtn  = document.getElementById('clearBtn');
  var historyBtn = document.getElementById('historyBtn');
  var statusEl  = document.getElementById('status');
  var toastEl   = document.getElementById('toast');
  var historyOverlay = document.getElementById('historyOverlay');
  var historyList = document.getElementById('historyList');
  var historyCount = document.getElementById('historyCount');
  var historyBackBtn = document.getElementById('historyBackBtn');
  var historyClearAllBtn = document.getElementById('historyClearAllBtn');
  var historyRecordToggle = document.getElementById('historyRecordToggle');

  var ws = null;
  var reconnectTimer = null;

  // ── Utils ──────────────────────────────────────────────────

  function setStatus(state, text) {
    statusEl.className = 'status ' + state;
    statusEl.textContent = text;
  }

  function showToast(msg, duration) {
    duration = duration || 1500;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(function() { toastEl.classList.remove('show'); }, duration);
  }

  function focusInput() {
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }

  // ── WebSocket ──────────────────────────────────────────────

  function connect() {
    if (ws && ws.readyState <= 1) return;

    clearTimeout(reconnectTimer);
    setStatus('connecting', 'Connecting...');

    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/ws');

    ws.onopen = function() {
      setStatus('connected', 'Connected');
    };

    ws.onmessage = function(evt) {
      try {
        var data = JSON.parse(evt.data);
        if (data.ok) {
          showToast('Pasted ' + data.len + ' chars');
        }
      } catch(e) {}
    };

    ws.onclose = function() {
      setStatus('disconnected', 'Disconnected');
      scheduleReconnect();
    };

    ws.onerror = function() {
      ws.close();
    };
  }

  function scheduleReconnect() {
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, 2000);
  }

  // ── History storage ────────────────────────────────────────

  var STORAGE_KEY = 'remote-input-history';
  var RECORDING_KEY = 'remote-input-history-recording';

  function isRecordingEnabled() {
    var val = localStorage.getItem(RECORDING_KEY);
    return val === null ? true : val === 'true';
  }

  function setRecordingEnabled(enabled) {
    localStorage.setItem(RECORDING_KEY, enabled ? 'true' : 'false');
  }

  function loadHistory() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch(e) {
      return [];
    }
  }

  function saveHistory(items) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function addToHistory(text) {
    if (!isRecordingEnabled()) return;
    var items = loadHistory();
    for (var i = 0; i < items.length; i++) {
      if (items[i].text === text) {
        items[i].ts = Date.now();
        saveHistory(items);
        return;
      }
    }
    items.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text: text, ts: Date.now(), pinned: false });
    saveHistory(items);
  }

  // ── History UI ─────────────────────────────────────────────

  function formatTime(ts) {
    var d = new Date(ts);
    var pad = function(n) { return n < 10 ? '0' + n : n; };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function renderHistory() {
    var items = loadHistory();
    items.sort(function(a, b) {
      if (a.pinned && !b.pinned) return -1;
      if (!a.pinned && b.pinned) return 1;
      return b.ts - a.ts;
    });

    historyCount.textContent = items.length > 0 ? '(' + items.length + ')' : '';
    historyList.innerHTML = '';
    if (items.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'history-empty';
      empty.textContent = 'No history yet';
      historyList.appendChild(empty);
      return;
    }

    var CLAMP_LEN = 200;

    items.forEach(function(item) {
      var el = document.createElement('div');
      el.className = 'history-item' + (item.pinned ? ' pinned' : '');

      var content = document.createElement('div');
      content.className = 'history-item-content';

      var textEl = document.createElement('div');
      textEl.className = 'history-item-text';
      textEl.textContent = item.text;
      var needsClamp = item.text.length > CLAMP_LEN;
      if (needsClamp) {
        textEl.classList.add('clamped');
      }

      var metaEl = document.createElement('div');
      metaEl.className = 'history-item-meta';
      var timeSpan = document.createElement('span');
      timeSpan.textContent = (item.pinned ? '📌 ' : '') + formatTime(item.ts);
      var lenSpan = document.createElement('span');
      lenSpan.textContent = item.text.length + ' chars';
      metaEl.appendChild(timeSpan);
      metaEl.appendChild(lenSpan);

      content.appendChild(textEl);
      content.appendChild(metaEl);

      content.addEventListener('click', function() {
        var existing = input.value;
        if (existing && !existing.endsWith('\n')) {
          input.value = existing + '\n' + item.text;
        } else {
          input.value = existing + item.text;
        }
        closeHistory();
      });

      var actions = document.createElement('div');
      actions.className = 'history-item-actions' + (needsClamp ? '' : ' horizontal');

      if (needsClamp) {
        var expandBtn = document.createElement('button');
        expandBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M7 13l5 5 5-5"/><path d="M7 6l5 5 5-5"/></svg>';
        expandBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          var isClamped = textEl.classList.contains('clamped');
          if (isClamped) {
            textEl.classList.remove('clamped');
            expandBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M17 11l-5-5-5 5"/><path d="M17 18l-5-5-5 5"/></svg>';
          } else {
            textEl.classList.add('clamped');
            expandBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M7 13l5 5 5-5"/><path d="M7 6l5 5 5-5"/></svg>';
          }
        });
        actions.appendChild(expandBtn);
      }

      var pinBtn = document.createElement('button');
      pinBtn.className = item.pinned ? 'pinned' : '';
      pinBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="' + (item.pinned ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z"/></svg>';
      pinBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        togglePin(item.id);
      });

      var deleteBtn = document.createElement('button');
      deleteBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
      deleteBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        deleteItem(item.id, item.text);
      });

      actions.appendChild(pinBtn);
      actions.appendChild(deleteBtn);

      el.appendChild(content);
      el.appendChild(actions);
      historyList.appendChild(el);
    });
  }

  function togglePin(id) {
    var items = loadHistory();
    for (var i = 0; i < items.length; i++) {
      if (items[i].id === id) {
        items[i].pinned = !items[i].pinned;
        break;
      }
    }
    saveHistory(items);
    renderHistory();
  }

  function deleteItem(id, text) {
    if (!confirm('Delete "' + (text.length > 30 ? text.slice(0, 30) + '…' : text) + '"?')) return;
    var items = loadHistory().filter(function(item) { return item.id !== id; });
    saveHistory(items);
    renderHistory();
  }

  function clearAllHistory() {
    var items = loadHistory();
    var pinned = items.filter(function(item) { return item.pinned; });
    if (pinned.length === items.length) {
      showToast('All items are pinned');
      return;
    }
    if (!confirm('Delete all unpinned history? (' + (items.length - pinned.length) + ' items)')) return;
    saveHistory(pinned);
    renderHistory();
  }

  function openHistory() {
    historyRecordToggle.checked = isRecordingEnabled();
    renderHistory();
    historyOverlay.classList.add('open');
  }

  function closeHistory() {
    historyOverlay.classList.remove('open');
    focusInput();
  }

  // ── Send ───────────────────────────────────────────────────

  function send() {
    var text = input.value.trim();
    if (!text) { focusInput(); return; }
    if (!ws || ws.readyState !== 1) {
      showToast('Not connected');
      focusInput();
      return;
    }
    addToHistory(text);
    ws.send(text);
    input.value = '';
    focusInput();
  }

  // ── Event listeners ────────────────────────────────────────

  sendBtn.addEventListener('click', send);

  clearBtn.addEventListener('click', function() {
    input.value = '';
    focusInput();
  });

  historyBtn.addEventListener('click', function() {
    openHistory();
  });

  historyBackBtn.addEventListener('click', closeHistory);

  historyClearAllBtn.addEventListener('click', clearAllHistory);

  historyRecordToggle.addEventListener('change', function() {
    setRecordingEnabled(historyRecordToggle.checked);
  });

  // Pin body to the visible viewport so the browser has no off-screen
  // area to scroll to when the keyboard opens / closes.
  if (window.visualViewport) {
    function onViewportResize() {
      var vv = window.visualViewport;
      document.body.style.position = 'fixed';
      document.body.style.width    = '100%';
      document.body.style.height   = vv.height + 'px';
      document.body.style.top      = vv.offsetTop + 'px';
    }
    window.visualViewport.addEventListener('resize', onViewportResize);
    window.visualViewport.addEventListener('scroll', onViewportResize);
    onViewportResize();
  }

  connect();
})();
</script>
</body>
</html>
